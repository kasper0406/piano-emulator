language = "C"
header = """/* piano_emulator.h — the C ABI of the physical-model piano.
 *
 * GENERATED by `ffi/generate-header.sh` (cbindgen 0.28.0) from `ffi/src/lib.rs`.
 * Do not edit: edit the Rust and regenerate. `ffi/tests/header.rs` fails if the
 * committed header and the source have drifted.
 *
 * Every function states the thread it belongs on. That contract is the reason
 * this header exists rather than a flat generated surface; see the module
 * comment in `ffi/src/lib.rs` for it in one piece.
 *
 * SPDX-License-Identifier: MIT
 */"""
include_guard = "PIANO_EMULATOR_H"
pragma_once = false
no_includes = true
sys_includes = ["stdbool.h", "stddef.h", "stdint.h"]
cpp_compat = true
documentation = true
documentation_style = "doxy"
usize_is_size_t = true
line_length = 80
tab_width = 4

[parse]
parse_deps = false

[export]
include = ["pe_event_kind", "pe_status", "pe_event_t"]
# The resampler's own constants are Rust-internal detail with no `pe_` prefix;
# a C header is a namespace and they do not belong in it.
exclude = ["SINC_LEN", "F_CUTOFF", "OVERSAMPLING"]

[enum]
prefix_with_name = false
rename_variants = "None"

[defines]
