[package]
name = "piano-tuner"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Offline partial tracking and parameter estimation for piano-emulator"

[lib]
name = "piano_tuner"
path = "src/lib.rs"

[[bin]]
name = "piano-tuner"
path = "src/main.rs"

[features]
# The sampler's translation of the engine's own event list into the reference
# player's (`sampler::engine_events`). Off by default so the library still
# links without the engine; on inside this crate's own tests, which have the
# engine as a dev-dependency anyway.
engine-events = ["dep:piano-emulator"]
# Gates the one-shot forensic examples out of the default build graph; see the
# [[example]] blocks at the end of this file. Implies engine-events, which most
# of those drivers need to render through the real instrument.
diagnostics = ["engine-events"]

[dependencies]
hound = "3.5"
# Only for `engine-events`; see the dev-dependency note below.
piano-emulator = { path = "../engine", optional = true }
claxon = "0.4"
rubato = "0.15"
rustfft = "6"
serde = { version = "1", features = ["derive"] }
# `float_roundtrip`: without it serde_json's fast float parser loses up to one
# ULP, so a cached trajectory would not reload as the numbers that were
# written. Estimators must give the same answer from cache as from a rerun.
serde_json = { version = "1", features = ["float_roundtrip"] }
toml = "0.8"

# The engine is a *dev*-dependency: the self-calibration gate renders its test
# material through the real instrument, but the library itself analyses
# recordings and must stay usable without an audio device on the link line.
[dev-dependencies]
piano-emulator = { path = "../engine" }
# Images for `examples/realism_bench.rs`. Pure Rust, no C, no image-processing
# stack: an encoder and nothing else. A dev-dependency because the library
# measures and the examples draw.
png = "0.17"
# The batch drivers and the self-calibration gate render tens of independent
# notes per run; each render builds its own engine and shares nothing, so the
# loops over them are data-parallel by construction. A *dev*-dependency for the
# same reason `png` is: the library measures one signal at a time and stays
# single-threaded, and only the tools that run it in bulk pay for a thread pool.
# Every parallel loop here collects into an ordered container, so the output is
# the same bytes at any thread count (`DECISIONS.md` 284).
rayon = "1.12"

# One-shot forensic/audit drivers: gated so `cargo test`/`cargo build` do not
# compile them on every iteration (they are ~1-2k lines each). Run with
#   cargo run --release -p piano-tuner --features diagnostics --example <name>

[[example]]
name = "audit_render"
required-features = ["diagnostics"]

[[example]]
name = "drift_line"
required-features = ["diagnostics"]

[[example]]
name = "eigenmode_prototype"
required-features = ["diagnostics"]

[[example]]
name = "fit_sympathetic"
required-features = ["diagnostics"]

[[example]]
name = "gain_level"
required-features = ["diagnostics"]

[[example]]
name = "independent_audit"
required-features = ["diagnostics"]

[[example]]
name = "jitter_forensics"
required-features = ["diagnostics"]

[[example]]
name = "key_probe"
required-features = ["diagnostics"]

[[example]]
name = "ladder_analysis"
required-features = ["diagnostics"]

[[example]]
name = "limiter_probe"
required-features = ["diagnostics"]

[[example]]
