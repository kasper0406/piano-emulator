[package]
name = "piano-tuner"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Offline partial tracking and parameter estimation for piano-emulator"

[lib]
name = "piano_tuner"
path = "src/lib.rs"

[[bin]]
name = "piano-tuner"
path = "src/main.rs"

[features]
# The sampler's translation of the engine's own event list into the reference
# player's (`sampler::engine_events`). Off by default so the library still
# links without the engine; on inside this crate's own tests, which have the
# engine as a dev-dependency anyway.
engine-events = ["dep:piano-emulator"]

[dependencies]
hound = "3.5"
# Only for `engine-events`; see the dev-dependency note below.
piano-emulator = { path = "../engine", optional = true }
claxon = "0.4"
rubato = "0.15"
rustfft = "6"
serde = { version = "1", features = ["derive"] }
# `float_roundtrip`: without it serde_json's fast float parser loses up to one
# ULP, so a cached trajectory would not reload as the numbers that were
# written. Estimators must give the same answer from cache as from a rerun.
serde_json = { version = "1", features = ["float_roundtrip"] }
toml = "0.8"

# The engine is a *dev*-dependency: the self-calibration gate renders its test
# material through the real instrument, but the library itself analyses
# recordings and must stay usable without an audio device on the link line.
[dev-dependencies]
piano-emulator = { path = "../engine" }
# Images for `examples/realism_bench.rs`. Pure Rust, no C, no image-processing
# stack: an encoder and nothing else. A dev-dependency because the library
# measures and the examples draw.
png = "0.17"
