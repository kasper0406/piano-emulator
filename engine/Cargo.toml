[package]
name = "piano-emulator"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[lib]
name = "piano_emulator"
path = "src/lib.rs"

[[bin]]
name = "piano-emulator"
path = "src/main.rs"

[dependencies]
cpal = "0.15"
hound = "3.5"
rtrb = "0.3"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
# `parallel` (rayon) is off: MIDI files are small and loading them is not on
# any hot path.
midly = { version = "0.5", default-features = false, features = ["std"] }

# Live MIDI input. macOS-only by construction — it is Core MIDI — so the
# dependency is target-gated and the module behind it is `cfg(target_os)`d;
# `cargo build` on anything else drops both and keeps the file replay.
# 0.9 is the first release with `MIDIInputPortCreateWithProtocol`
# (`Client::input_port_with_protocol`), which is the whole MIDI 2.0 path.
[target.'cfg(target_os = "macos")'.dependencies]
coremidi = "0.9"

[dev-dependencies]
rustfft = "6"
