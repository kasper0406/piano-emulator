[package]
name = "piano-emulator"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[lib]
name = "piano_emulator"
path = "src/lib.rs"

[[bin]]
name = "piano-emulator"
path = "src/main.rs"

[dependencies]
cpal = "0.15"
hound = "3.5"
rtrb = "0.3"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
# `parallel` (rayon) is off: MIDI files are small and loading them is not on
# any hot path.
midly = { version = "0.5", default-features = false, features = ["std"] }

[dev-dependencies]
rustfft = "6"
