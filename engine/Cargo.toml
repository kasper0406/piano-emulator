[package]
name = "piano-emulator"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"

[lib]
name = "piano_emulator"
path = "src/lib.rs"

[[bin]]
name = "piano-emulator"
path = "src/main.rs"

[dependencies]
cpal = "0.15"
hound = "3.5"
rtrb = "0.3"

[dev-dependencies]
rustfft = "6"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
